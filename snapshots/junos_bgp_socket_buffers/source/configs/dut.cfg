system {
    host-name dut;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 192.0.2.0/31;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 198.51.100.0/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.1/32;
            }
        }
    }
}
routing-options {
    autonomous-system 65001;
    router-id 10.255.0.1;
}
protocols {
    bgp {
        receive-buffer 64k;
        send-buffer 64k;
        group TEST {
            type external;
            receive-buffer 128k;
            send-buffer 128k;
            peer-as 65002;
            neighbor 192.0.2.1 {
                receive-buffer 256k;
                send-buffer 256k;
            }
        }
    }
}
routing-instances {
    VR1 {
        instance-type virtual-router;
        interface ge-0/0/1.0;
        routing-options {
            router-id 10.255.0.11;
        }
        protocols {
            bgp {
                /* unnormalized spellings of 64k, 128k, and 256k */
                receive-buffer 65536;
                send-buffer 65536;
                group TEST {
                    type external;
                    receive-buffer 128K;
                    send-buffer 128K;
                    peer-as 65002;
                    neighbor 198.51.100.1 {
                        receive-buffer 0x40000;
                        send-buffer 0x40000;
                    }
                }
            }
        }
    }
}
