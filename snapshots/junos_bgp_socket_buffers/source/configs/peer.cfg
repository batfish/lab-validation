hostname peer
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Loopback0
   ip address 10.255.0.2/32
!
interface Ethernet1
   no switchport
   ip address 192.0.2.1/31
!
interface Ethernet2
   no switchport
   ip address 198.51.100.1/31
!
ip routing
!
ip route 203.0.113.0/24 Null0
!
router bgp 65002
   router-id 10.255.0.2
   neighbor 192.0.2.0 remote-as 65001
   neighbor 192.0.2.0 description dut-master
   neighbor 198.51.100.0 remote-as 65001
   neighbor 198.51.100.0 description dut-VR1
   network 203.0.113.0/24
!
end
