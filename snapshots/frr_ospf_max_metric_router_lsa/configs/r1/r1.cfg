r1
# This file describes the network interfaces
auto lo
iface lo inet loopback

auto eth1
iface eth1

auto eth2
iface eth2

# ports.conf --
frr version 10.7.1_git
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
route-map STATIC-E1 permit 10
 set metric 20
 set metric-type type-1
exit
!
ip route 192.0.2.0/24 blackhole
!
interface eth1
 ip address 10.11.0.1/31
 ip ospf area 1
 ip ospf network point-to-point
exit
!
interface eth2
 ip address 10.12.0.1/31
 ip ospf area 1
 ip ospf cost 40000
 ip ospf network point-to-point
exit
!
interface lo
 ip address 10.255.1.1/32
 ip ospf area 1
exit
!
router ospf
 ospf router-id 10.255.1.1
 redistribute static route-map STATIC-E1
exit
!
end
