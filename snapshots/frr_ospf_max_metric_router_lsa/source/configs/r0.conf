frr version 10.7.1
frr defaults traditional
hostname r0
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.10/32
 ip ospf area 0
!
interface eth1
 ip address 10.0.1.0/31
 ip ospf area 0
 ip ospf network point-to-point
!
interface eth2
 ip address 10.0.2.0/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf cost 40000
!
router ospf
 ospf router-id 10.255.0.10
!
end
