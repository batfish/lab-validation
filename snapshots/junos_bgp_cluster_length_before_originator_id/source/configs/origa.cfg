hostname origa
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Loopback0
   ip address 10.255.0.9/32
!
interface Ethernet1
   no switchport
   ip address 10.0.3.1/31
!
ip routing
!
ip route 203.0.113.0/24 Null0
!
router bgp 65000
   router-id 10.255.0.9
   neighbor 10.0.3.0 remote-as 65000
   neighbor 10.0.3.0 description rra
   network 203.0.113.0/24
!
end
