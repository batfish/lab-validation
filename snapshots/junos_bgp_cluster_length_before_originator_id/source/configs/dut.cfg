system {
    host-name dut;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.1.0/31;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.0.2.0/31;
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet {
                address 10.0.11.0/31;
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            family inet {
                address 10.0.12.0/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.5/32;
            }
        }
    }
}
routing-options {
    autonomous-system 65000;
    router-id 10.255.0.5;
}
protocols {
    bgp {
        /* no path-selection statement: baseline */
        group RR {
            type internal;
            neighbor 10.0.1.1 {
                description "rrb1, path B";
            }
            neighbor 10.0.2.1 {
                description "rra, path A";
            }
        }
    }
}
routing-instances {
    /* same two paths, with compare-cluster-length-before-originator-id */
    KNOB {
        instance-type virtual-router;
        interface ge-0/0/2.0;
        interface ge-0/0/3.0;
        routing-options {
            router-id 10.255.0.6;
        }
        protocols {
            bgp {
                path-selection compare-cluster-length-before-originator-id;
                group RR {
                    type internal;
                    neighbor 10.0.11.1 {
                        description "rrb1, path B";
                    }
                    neighbor 10.0.12.1 {
                        description "rra, path A";
                    }
                }
            }
        }
    }
}
