hostname rra
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Loopback0
   ip address 10.255.0.2/32
!
interface Ethernet1
   no switchport
   ip address 10.0.2.1/31
!
interface Ethernet2
   no switchport
   ip address 10.0.3.0/31
!
interface Ethernet3
   no switchport
   ip address 10.0.12.1/31
!
ip routing
!
router bgp 65000
   router-id 10.255.0.2
   bgp cluster-id 10.255.1.2
   neighbor 10.0.2.0 remote-as 65000
   neighbor 10.0.2.0 description dut-master
   neighbor 10.0.2.0 next-hop-self
   neighbor 10.0.3.1 remote-as 65000
   neighbor 10.0.3.1 description origa
   neighbor 10.0.3.1 route-reflector-client
   neighbor 10.0.12.0 remote-as 65000
   neighbor 10.0.12.0 description dut-KNOB
   neighbor 10.0.12.0 next-hop-self
!
end
