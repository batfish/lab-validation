hostname rrb2
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Loopback0
   ip address 10.255.0.4/32
!
interface Ethernet1
   no switchport
   ip address 10.0.4.1/31
!
interface Ethernet2
   no switchport
   ip address 10.0.5.0/31
!
ip routing
!
router bgp 65000
   router-id 10.255.0.4
   bgp cluster-id 10.255.1.4
   neighbor 10.0.4.0 remote-as 65000
   neighbor 10.0.4.0 description rrb1
   neighbor 10.0.4.0 next-hop-self
   neighbor 10.0.5.1 remote-as 65000
   neighbor 10.0.5.1 description origb
   neighbor 10.0.5.1 route-reflector-client
!
end
