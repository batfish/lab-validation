# Preconditions for the L2 multiple-route-target EVPN lab. Verifies the
# underlay is up and each leaf originates its VTEP/overlay loopbacks, so
# the collected snapshot reflects an established L2 EVPN overlay carrying
# the multi-route-target vlan-aware-bundle.

checks:
  - type: bgp_peer_established
    node: leaf1
    neighbor: 172.31.255.1
    description: "leaf1 -> leaf2 IPv4 underlay"
  - type: bgp_peer_established
    node: leaf2
    neighbor: 172.31.255.0
    description: "leaf2 -> leaf1 IPv4 underlay"

  # Each leaf advertises the peer's VTEP source into the underlay, a
  # prerequisite for the EVPN overlay (multihop over Loopback0) to form.
  - type: route_exists
    node: leaf1
    table: default
    prefix: 192.168.254.2/32
    description: "leaf1 learns leaf2 VTEP source via underlay"
  - type: route_exists
    node: leaf2
    table: default
    prefix: 192.168.254.1/32
    description: "leaf2 learns leaf1 VTEP source via underlay"
