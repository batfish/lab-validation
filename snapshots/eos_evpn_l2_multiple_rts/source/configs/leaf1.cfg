! leaf1 (AS 65101): L2 EVPN VTEP whose vlan-aware-bundle BLUE declares
! MULTIPLE `route-target import` and `route-target export` lines. This lab
! exists to prove Batfish retains all of them (does not overwrite with the
! last), visible in the vendor-independent Layer2VniConfig. Reference:
! batfish/batfish#10113.
!
hostname leaf1
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
service routing protocols model multi-agent
!
vlan 110
   name BLUE_L2
!
interface Loopback0
   description EVPN_Overlay_Peering
   ip address 192.168.255.1/32
!
interface Loopback1
   description VTEP_source
   ip address 192.168.254.1/32
!
interface Ethernet1
   description P2P_UNDERLAY_TO_leaf2
   no switchport
   ip address 172.31.255.0/31
!
interface Ethernet2
   description host_facing
   switchport access vlan 110
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 110 vni 10110
!
ip routing
!
ip prefix-list PL-LOOPBACKS
   seq 10 permit 192.168.255.0/24 eq 32
   seq 20 permit 192.168.254.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
router bgp 65101
   router-id 192.168.255.1
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   neighbor 172.31.255.1 remote-as 65102
   neighbor 192.168.255.2 remote-as 65102
   neighbor 192.168.255.2 update-source Loopback0
   neighbor 192.168.255.2 ebgp-multihop 3
   neighbor 192.168.255.2 send-community extended
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan-aware-bundle BLUE
      rd 192.168.255.1:10110
      route-target import 65000:100
      route-target import 65000:199
      route-target export 65000:200
      route-target export 65000:299
      redistribute learned
      vlan 110
   !
   address-family evpn
      neighbor 192.168.255.2 activate
   !
   address-family ipv4
      neighbor 172.31.255.1 activate
      network 192.168.255.1/32
      network 192.168.254.1/32
!
end
