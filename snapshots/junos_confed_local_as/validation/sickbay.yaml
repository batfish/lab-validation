entries:
  # batfish/batfish#10420: Batfish does not treat AS 7, r1's confederation
  # identifier, as a loop, so r2's 10.20.1.0/24 is installed on r1 and leaks
  # to r3 and r4. #10421: confederation segments are sent to r2 and r4.
  # #10422: local-as 65100 is not prepended toward r3.
  - hostname: "r1|r3|r4"
    test_name: test_main_rib_routes
    skip:
      reason: https://github.com/batfish/batfish/issues/10420
  - hostname: "r1|r2|r3|r4"
    test_name: test_bgp_rib_routes
    skip:
      reason: https://github.com/batfish/batfish/issues/10420; https://github.com/batfish/batfish/issues/10421; https://github.com/batfish/batfish/issues/10422
