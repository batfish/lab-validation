system {
    host-name r2;
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 10.2.2.2/32;
            }
        }
    }
    ge-0/0/0 {
        description "to r1";
        unit 0 {
            family inet {
                address 10.0.12.1/31;
            }
        }
    }
}
routing-options {
    router-id 10.2.2.2;
    autonomous-system 7;
    static {
        route 10.20.1.0/24 discard;
    }
}
policy-options {
    policy-statement EXPORT-STATIC {
        term static {
            from protocol static;
            then accept;
        }
    }
}
protocols {
    bgp {
        group TO-R1 {
            type external;
            export EXPORT-STATIC;
            peer-as 65100;
            neighbor 10.0.12.0;
        }
    }
}
