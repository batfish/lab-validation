system {
    host-name r1;
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 10.1.1.1/32;
            }
        }
    }
    ge-0/0/0 {
        description "to r2 (AS 7, the confederation AS)";
        unit 0 {
            family inet {
                address 10.0.12.0/31;
            }
        }
    }
    ge-0/0/1 {
        description "to r3 (confederation member AS 65002)";
        unit 0 {
            family inet {
                address 10.0.13.0/31;
            }
        }
    }
    ge-0/0/2 {
        description "to r4 (AS 65200)";
        unit 0 {
            family inet {
                address 10.0.14.0/31;
            }
        }
    }
}
routing-options {
    router-id 10.1.1.1;
    autonomous-system 65001;
    confederation 7 members [ 65001 65002 ];
    static {
        route 10.10.1.0/24 discard;
    }
}
policy-options {
    policy-statement EXPORT-LOCAL {
        term static {
            from protocol static;
            then accept;
        }
        term direct {
            from protocol direct;
            then accept;
        }
    }
}
protocols {
    bgp {
        group CONFED {
            type external;
            export EXPORT-LOCAL;
            peer-as 65002;
            neighbor 10.0.13.1;
        }
        group EXTERNAL {
            type external;
            export EXPORT-LOCAL;
            peer-as 7;
            local-as 65100 private no-prepend-global-as;
            neighbor 10.0.12.1;
        }
        group EXTERNAL-PLAIN {
            type external;
            export EXPORT-LOCAL;
            peer-as 65200;
            local-as 65100;
            neighbor 10.0.14.1;
        }
    }
}
