system {
    host-name r3;
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 10.3.3.3/32;
            }
        }
    }
    ge-0/0/0 {
        description "to r1";
        unit 0 {
            family inet {
                address 10.0.13.1/31;
            }
        }
    }
}
routing-options {
    router-id 10.3.3.3;
    autonomous-system 65002;
    confederation 7 members [ 65001 65002 ];
    static {
        route 10.30.1.0/24 discard;
    }
}
policy-options {
    policy-statement EXPORT-STATIC {
        term static {
            from protocol static;
            then accept;
        }
    }
}
protocols {
    bgp {
        group TO-R1 {
            type external;
            export EXPORT-STATIC;
            peer-as 65001;
            neighbor 10.0.13.0;
        }
    }
}
