system {
    host-name dut;
}
interfaces {
    ge-0/0/0 {
        description "to src (AS 65010)";
        unit 0 {
            family inet {
                address 10.0.1.1/31;
            }
        }
    }
    ge-0/0/1 {
        description "to rx (AS 300)";
        unit 0 {
            family inet {
                address 10.0.2.0/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.2/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.2;
    autonomous-system 200;
}
policy-options {
    policy-statement IMPORT-COLOR {
        term color-100 {
            from {
                route-filter 10.130.1.0/24 exact;
            }
            then {
                color 100;
                accept;
            }
        }
        term color2-200 {
            from {
                route-filter 10.130.2.0/24 exact;
            }
            then {
                color2 200;
                accept;
            }
        }
        term uncolored {
            then accept;
        }
    }
    /* No terminating action: the route goes on to MATCH-COLOR with color 400. */
    policy-statement SET-COLOR {
        term color-400 {
            from {
                route-filter 10.130.3.0/24 exact;
            }
            then color 400;
        }
    }
    policy-statement MATCH-COLOR {
        term color-100 {
            from color 100;
            then accept;
        }
        term color2-200 {
            from color2 200;
            then accept;
        }
        term color-400 {
            from color 400;
            then accept;
        }
        term reject {
            then reject;
        }
    }
}
protocols {
    bgp {
        group SRC {
            type external;
            import IMPORT-COLOR;
            peer-as 65010;
            neighbor 10.0.1.0;
        }
        group RX {
            type external;
            export [ SET-COLOR MATCH-COLOR ];
            peer-as 300;
            neighbor 10.0.2.1;
        }
    }
}
