system {
    host-name rx;
}
interfaces {
    ge-0/0/0 {
        description "to dut (AS 200)";
        unit 0 {
            family inet {
                address 10.0.2.1/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.3/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.3;
    autonomous-system 300;
}
policy-options {
    /* Rejects 10.130.1.0/24 only if dut's color 100 reached rx. */
    policy-statement IMPORT {
        term color-100 {
            from color 100;
            then reject;
        }
        term all {
            then accept;
        }
    }
}
protocols {
    bgp {
        group DUT {
            type external;
            import IMPORT;
            peer-as 200;
            neighbor 10.0.2.0;
        }
    }
}
