entries:
  # batfish#10488: `from color` makes the data plane computation fail on
  # master (MatchColor.evaluate throws), so every data plane test fails.
  # Without the crash, `from color2`, `then color`, `then color2` and a
  # static route's color are also unmodeled. dont_run: the crash is in the
  # data plane fixture, before the test body, so xfail cannot catch it.
  - hostname: ".*"
    test_name: test_interface_properties
    skip:
      skip_type: dont_run
      reason: "https://github.com/batfish/batfish/issues/10488"
  - hostname: ".*"
    test_name: test_main_rib_routes
    skip:
      skip_type: dont_run
      reason: "https://github.com/batfish/batfish/issues/10488"
  - hostname: ".*"
    test_name: test_bgp_rib_routes
    skip:
      skip_type: dont_run
      reason: "https://github.com/batfish/batfish/issues/10488"
  - hostname: ".*"
    test_name: test_evpn_rib_routes
    skip:
      skip_type: dont_run
      reason: "https://github.com/batfish/batfish/issues/10488"
