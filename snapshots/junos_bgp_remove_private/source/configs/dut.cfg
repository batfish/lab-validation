system {
    host-name dut;
}
interfaces {
    ge-0/0/0 {
        description "to src (AS 65010)";
        unit 0 {
            family inet {
                address 10.0.1.1/31;
            }
        }
    }
    ge-0/0/1 {
        description "to rx300 (AS 300)";
        unit 0 {
            family inet {
                address 10.0.2.0/31;
            }
        }
    }
    ge-0/0/2 {
        description "to rx65030 (AS 65030)";
        unit 0 {
            family inet {
                address 10.0.3.0/31;
            }
        }
    }
    ge-0/0/3 {
        description "to ribgp (AS 200, iBGP)";
        unit 0 {
            family inet {
                address 10.0.4.0/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.2/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.2;
    autonomous-system 200;
}
policy-options {
    /* Import prepends go to the left of the path src sent (65010). */
    policy-statement SHAPE-PATHS {
        term p2-private-public-private {
            from {
                route-filter 10.100.2.0/24 exact;
            }
            then {
                as-path-prepend "65011 100";
                accept;
            }
        }
        term p3-public-first {
            from {
                route-filter 10.100.3.0/24 exact;
            }
            then {
                as-path-prepend "100 65011";
                accept;
            }
        }
        term p4-public-peer-as-after-private {
            from {
                route-filter 10.100.4.0/24 exact;
            }
            then {
                as-path-prepend "65011 300";
                accept;
            }
        }
        term p5-public-peer-as-after-public {
            from {
                route-filter 10.100.5.0/24 exact;
            }
            then {
                as-path-prepend "65011 100 300";
                accept;
            }
        }
        term p6-private-peer-as-among-private {
            from {
                route-filter 10.100.6.0/24 exact;
            }
            then {
                as-path-prepend "65011 65030 65012";
                accept;
            }
        }
        term other {
            then accept;
        }
    }
    policy-statement NEXT-HOP-SELF {
        term all {
            then next-hop self;
        }
    }
    /* Applied to every group, after any next-hop change. */
    policy-statement EXPORT {
        term p7-prepend-private {
            from {
                protocol bgp;
                route-filter 10.100.7.0/24 exact;
            }
            then {
                as-path-prepend 65099;
                accept;
            }
        }
        term p8-prepend-public {
            from {
                protocol bgp;
                route-filter 10.100.8.0/24 exact;
            }
            then {
                as-path-prepend 400;
                accept;
            }
        }
        term bgp {
            from protocol bgp;
            then accept;
        }
        term reject {
            then reject;
        }
    }
}
protocols {
    bgp {
        group SRC {
            type external;
            import SHAPE-PATHS;
            peer-as 65010;
            neighbor 10.0.1.0;
        }
        group RX300 {
            type external;
            export EXPORT;
            remove-private;
            peer-as 300;
            neighbor 10.0.2.1;
        }
        group RX65030 {
            type external;
            export EXPORT;
            remove-private;
            peer-as 65030;
            neighbor 10.0.3.1;
        }
        group RIBGP {
            type internal;
            local-address 10.0.4.0;
            export [ NEXT-HOP-SELF EXPORT ];
            remove-private;
            neighbor 10.0.4.1;
        }
    }
}
