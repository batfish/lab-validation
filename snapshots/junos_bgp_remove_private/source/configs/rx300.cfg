system {
    host-name rx300;
}
interfaces {
    ge-0/0/0 {
        description "to dut (AS 200)";
        unit 0 {
            family inet {
                address 10.0.2.1/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.3/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.3;
    /* Accept paths that contain 300 (10.100.4.0/24, 10.100.5.0/24). */
    autonomous-system 300 loops 2;
}
protocols {
    bgp {
        group DUT {
            type external;
            peer-as 200;
            neighbor 10.0.2.0;
        }
    }
}
