system {
    host-name rx65030;
}
interfaces {
    ge-0/0/0 {
        description "to dut (AS 200)";
        unit 0 {
            family inet {
                address 10.0.3.1/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.4/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.4;
    /* Accept paths that contain 65030 (10.100.6.0/24). */
    autonomous-system 65030 loops 2;
}
protocols {
    bgp {
        group DUT {
            type external;
            peer-as 200;
            neighbor 10.0.3.0;
        }
    }
}
