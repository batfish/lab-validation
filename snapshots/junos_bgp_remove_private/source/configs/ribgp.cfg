system {
    host-name ribgp;
}
interfaces {
    ge-0/0/0 {
        description "to dut (AS 200)";
        unit 0 {
            family inet {
                address 10.0.4.1/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.5/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.5;
    autonomous-system 200;
}
protocols {
    bgp {
        group DUT {
            type internal;
            local-address 10.0.4.1;
            neighbor 10.0.4.0;
        }
    }
}
