# Preconditions for the divergent-contributor aggregate lab. Verifies all
# eBGP sessions are up, both contributors reach the aggregator on their
# distinct paths, and the aggregate is generated and received downstream.

checks:
  - type: bgp_peer_established
    node: c1
    neighbor: 10.10.1.2
    description: "c1 -> c0 eBGP"
  - type: bgp_peer_established
    node: c4
    neighbor: 10.10.2.2
    description: "c4 -> c0 eBGP"
  - type: bgp_peer_established
    node: c0
    neighbor: 10.10.3.2
    description: "c0 -> c2 eBGP"
  - type: bgp_peer_established
    node: c2
    neighbor: 10.10.3.1
    description: "c2 -> c0 eBGP"
  - type: bgp_peer_established
    node: c2
    neighbor: 11.11.11.1
    description: "c2 -> c3 eBGP"
  - type: bgp_peer_established
    node: c3
    neighbor: 11.11.11.2
    description: "c3 -> c2 eBGP"

  # Both contributors originate.
  - type: route_exists
    node: c1
    table: default
    prefix: 10.1.1.0/24
    description: "10.1.1.0/24 static in c1 RIB"
  - type: route_exists
    node: c4
    table: default
    prefix: 10.1.2.0/24
    description: "10.1.2.0/24 static in c4 RIB"

  # Aggregator learns both contributors (on divergent paths) and generates
  # the aggregate.
  - type: route_exists
    node: c2
    table: default
    prefix: 10.1.1.0/24
    description: "10.1.1.0/24 learned on c2 (via 65000 65001)"
  - type: route_exists
    node: c2
    table: default
    prefix: 10.1.2.0/24
    description: "10.1.2.0/24 learned on c2 (via 65000 65003)"
  - type: route_exists
    node: c2
    table: default
    prefix: 10.1.0.0/16
    description: "10.1.0.0/16 aggregate generated on c2"

  # Downstream receives the aggregate.
  - type: route_exists
    node: c3
    table: default
    prefix: 10.1.0.0/16
    description: "10.1.0.0/16 aggregate received on c3"
