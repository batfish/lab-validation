! Transit AS 65000. Sits between the two origin ASes (c1, c4) and the
! aggregator (c2), so both contributors carry 65000 as their common leading
! AS before diverging into 65001 vs 65003.
!
hostname c0
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Ethernet1
   no switchport
   ip address 10.10.1.2/24
!
interface Ethernet2
   no switchport
   ip address 10.10.2.2/24
!
interface Ethernet3
   no switchport
   ip address 10.10.3.1/24
!
route-map ALLOW-ALL permit 10
!
ip routing
!
router bgp 65000
   router-id 10.0.0.0
   neighbor 10.10.1.1 remote-as 65001
   neighbor 10.10.1.1 route-map ALLOW-ALL in
   neighbor 10.10.1.1 route-map ALLOW-ALL out
   neighbor 10.10.2.1 remote-as 65003
   neighbor 10.10.2.1 route-map ALLOW-ALL in
   neighbor 10.10.2.1 route-map ALLOW-ALL out
   neighbor 10.10.3.2 remote-as 65002
   neighbor 10.10.3.2 route-map ALLOW-ALL in
   neighbor 10.10.3.2 route-map ALLOW-ALL out
!
end
