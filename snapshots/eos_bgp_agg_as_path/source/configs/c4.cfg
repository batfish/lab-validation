! Origin AS 65003. Redistributes a static 10.1.2.0/24 (the second
! contributor to c2's 10.1.0.0/16 aggregate) into BGP. Its AS differs from
! c1's so the two contributors diverge after the common transit AS 65000.
!
hostname c4
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Ethernet1
   no switchport
   ip address 10.10.2.1/24
!
route-map ALLOW-ALL permit 10
!
ip route 10.1.2.0/24 Null0
!
ip routing
!
router bgp 65003
   router-id 4.4.4.4
   redistribute static
   neighbor 10.10.2.2 remote-as 65000
   neighbor 10.10.2.2 route-map ALLOW-ALL in
   neighbor 10.10.2.2 route-map ALLOW-ALL out
!
end
