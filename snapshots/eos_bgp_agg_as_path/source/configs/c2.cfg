! Aggregating router, AS 65002. Learns two contributors with divergent
! AS_PATHs (10.1.1.0/24 via "65000 65001", 10.1.2.0/24 via "65000 65003")
! and aggregates them into 10.1.0.0/16. No as-set, no summary-only, no
! advertise-only: this lab isolates how EOS forms the aggregate AS_PATH
! from contributors that arrive on different paths. Advertises the result
! to c3 (AS 65004).
!
hostname c2
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Ethernet1
   no switchport
   ip address 10.10.3.2/24
!
interface Ethernet2
   no switchport
   ip address 11.11.11.2/24
!
route-map ALLOW-ALL permit 10
!
ip routing
!
router bgp 65002
   router-id 2.2.2.2
   aggregate-address 10.1.0.0/16
   neighbor 10.10.3.1 remote-as 65000
   neighbor 10.10.3.1 route-map ALLOW-ALL in
   neighbor 10.10.3.1 route-map ALLOW-ALL out
   neighbor 11.11.11.1 remote-as 65004
   neighbor 11.11.11.1 route-map ALLOW-ALL in
   neighbor 11.11.11.1 route-map ALLOW-ALL out
!
end
