entries:
  # Aggregate AS_PATH divergence (batfish/batfish#10094), exercised here for
  # contributors that arrive on DIFFERENT AS_PATHs. The device forms the
  # aggregate 10.1.0.0/16 AS_PATH from the longest common leading AS_SEQUENCE
  # of its contributors -- "65000 65001 ?" and "65000 65003 ?" collapse to
  # "65000 ?" with atomic-aggregate, dropping the divergent tail. Batfish
  # models an empty AS_PATH. Consequences:
  #   - c2 (aggregator): aggregate as_path (65000,) on device vs () in Batfish.
  #   - c3 (downstream): received aggregate (65002, 65000) vs () in Batfish.
  #   - c0 (transit AS): device rejects the re-advertised aggregate as an
  #     AS-path loop (65000 in path); Batfish (empty path) installs it and
  #     propagates it on to c1/c4, which the device never receives.
  # https://github.com/batfish/batfish/issues/10094
  - hostname: c0|c1|c2|c3|c4
    test_name: test_bgp_rib_routes
    skip:
      reason: aggregate AS_PATH divergence, https://github.com/batfish/batfish/issues/10094

  # Main RIB: Batfish installs the aggregate (no AS-path loop with an empty
  # as-path) on the transit/contributor ASes that the device rejects.
  # https://github.com/batfish/batfish/issues/10094
  - hostname: c0|c1|c4
    test_name: test_main_rib_routes
    skip:
      reason: aggregate AS_PATH divergence, https://github.com/batfish/batfish/issues/10094
