system {
    host-name sender;
}
interfaces {
    lo0 {
        unit 0 {
            family inet {
                address 1.1.1.1/32;
            }
        }
    }
    ge-0/0/0 {
        description "link to receiver";
        unit 0 {
            family inet {
                address 10.0.12.0/31;
            }
        }
    }
    ge-0/0/1 {
        description "link to receiver (DEFAULTS)";
        unit 0 {
            family inet {
                address 10.0.13.0/31;
            }
        }
    }
}
routing-options {
    autonomous-system 65001;
    router-id 1.1.1.1;
    static {
        route 10.10.0.0/24 {
            discard;
            community 65001:10;
        }
        route 10.10.1.0/24 {
            discard;
            community large:65001:10:1;
        }
        route 10.10.2.0/24 {
            discard;
            community [ 65001:10 large:65001:10:2 ];
        }
        /* aggregate contributors */
        route 10.20.1.0/24 discard;
        route 10.21.1.0/24 discard;
        /* generate contributors (need a forwarding next hop) */
        route 10.30.1.0/24 next-hop 10.0.12.1;
        route 10.31.1.0/24 next-hop 10.0.12.1;
    }
    aggregate {
        route 10.20.0.0/16 community 65001:20;
        route 10.21.0.0/16 community large:65001:21:1;
    }
    generate {
        route 10.30.0.0/16 community 65001:30;
        route 10.31.0.0/16 community large:65001:31:1;
    }
}
policy-options {
    policy-statement ADVERTISE {
        term local {
            from protocol [ static aggregate generate ];
            /* generate contributors resolve via the receiver; without
               next-hop self the receiver hides them (nexthop is local) */
            then {
                next-hop self;
                accept;
            }
        }
        term default {
            then reject;
        }
    }
}
routing-instances {
    /* Exercises the defaults blocks in isolation from the master routes. */
    DEFAULTS {
        instance-type virtual-router;
        interface ge-0/0/1.0;
        routing-options {
            router-id 1.1.1.2;
            static {
                defaults {
                    community large:65001:40:1;
                }
                /* inherits the static defaults community */
                route 10.40.0.0/24 discard;
                /* per-route community alongside defaults */
                route 10.40.1.0/24 {
                    discard;
                    community 65001:41;
                }
                /* aggregate contributor */
                route 10.50.1.0/24 discard;
                /* generate contributor (needs a forwarding next hop) */
                route 10.60.1.0/24 next-hop 10.0.13.1;
            }
            aggregate {
                defaults {
                    community large:65001:50:1;
                }
                route 10.50.0.0/16;
            }
            generate {
                defaults {
                    community large:65001:60:1;
                }
                route 10.60.0.0/16;
            }
        }
        protocols {
            bgp {
                group TO-RECEIVER {
                    type external;
                    peer-as 65002;
                    neighbor 10.0.13.1 {
                        export ADVERTISE;
                    }
                }
            }
        }
    }
}
protocols {
    bgp {
        group TO-RECEIVER {
            type external;
            peer-as 65002;
            neighbor 10.0.12.1 {
                export ADVERTISE;
            }
        }
    }
}
