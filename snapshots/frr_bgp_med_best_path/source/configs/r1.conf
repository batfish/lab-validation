frr version 10.7.1
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.12.0/31
!
interface eth2
 ip address 10.0.13.0/31
!
interface eth3
 ip address 10.0.14.0/31
!
router bgp 64500
 bgp router-id 10.255.0.1
 neighbor 10.0.12.1 remote-as 64500
 neighbor 10.0.13.1 remote-as 64500
 neighbor 10.0.14.1 remote-as 64496
 !
 address-family ipv4 unicast
  neighbor 10.0.12.1 route-map NONE out
  neighbor 10.0.13.1 route-map NONE out
  neighbor 10.0.14.1 route-map ALLOW in
  neighbor 10.0.14.1 route-map NONE out
 exit-address-family
!
route-map ALLOW permit 10
!
route-map NONE deny 10
!
end
