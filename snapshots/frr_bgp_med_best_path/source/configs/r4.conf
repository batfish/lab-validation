frr version 10.7.1
frr defaults traditional
hostname r4
service integrated-vtysh-config
!
ip prefix-list P64 seq 5 permit 192.0.2.64/26
ip prefix-list P192 seq 5 permit 192.0.2.192/26
!
ip route 192.0.2.64/26 blackhole
ip route 192.0.2.192/26 blackhole
!
interface eth1
 ip address 10.0.14.1/31
!
router bgp 64496
 bgp router-id 10.255.0.4
 neighbor 10.0.14.0 remote-as 64500
 !
 address-family ipv4 unicast
  network 192.0.2.64/26
  network 192.0.2.192/26
  neighbor 10.0.14.0 route-map ALLOW in
  neighbor 10.0.14.0 route-map TO-R1 out
 exit-address-family
!
route-map ALLOW permit 10
!
route-map TO-R1 permit 10
 match ip address prefix-list P64
 set metric 100
!
route-map TO-R1 permit 20
 match ip address prefix-list P192
 set metric 10
!
end
