frr version 10.7.1
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
ip prefix-list P0 seq 5 permit 192.0.2.0/26
ip prefix-list P64 seq 5 permit 192.0.2.64/26
ip prefix-list P128 seq 5 permit 192.0.2.128/26
ip prefix-list P192 seq 5 permit 192.0.2.192/26
!
ip route 192.0.2.0/26 blackhole
ip route 192.0.2.64/26 blackhole
ip route 192.0.2.128/26 blackhole
ip route 192.0.2.192/26 blackhole
!
interface eth1
 ip address 10.0.12.1/31
!
router bgp 64500
 bgp router-id 10.255.0.2
 neighbor 10.0.12.0 remote-as 64500
 !
 address-family ipv4 unicast
  network 192.0.2.0/26
  network 192.0.2.64/26
  network 192.0.2.128/26
  network 192.0.2.192/26
  neighbor 10.0.12.0 route-map TO-R1 out
 exit-address-family
!
route-map TO-R1 permit 10
 match ip address prefix-list P0
 set as-path prepend 64497
 set metric 100
!
route-map TO-R1 permit 20
 match ip address prefix-list P64
 set as-path prepend 64496
 set metric 10
!
route-map TO-R1 permit 30
 match ip address prefix-list P128
 set as-path prepend 64497
 set metric 100
!
route-map TO-R1 permit 40
 match ip address prefix-list P192
 set as-path prepend 64496
 set metric 100
!
end
