! Aggregating router. All BGP sessions live in vrf vxlan_public under
! router bgp with asdot AS 65166.10010 (= 4270728986). The vrf carries
! `aggregate-address 0.0.0.0/0 advertise-only` WITHOUT summary-only, so
! contributors are NOT suppressed: c3 receives every learned route plus
! the aggregate. This is the companion to eos_bgp_agg_vrf_summary_only.
!
hostname c2
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
vrf instance vxlan_public
!
interface Ethernet1
   no switchport
   vrf vxlan_public
   ip address 10.10.10.2/24
!
interface Ethernet2
   no switchport
   vrf vxlan_public
   ip address 11.11.11.2/24
!
route-map ALLOW-ALL permit 10
!
ip routing
ip routing vrf vxlan_public
!
router bgp 65166.10010
   router-id 2.2.2.2
   !
   vrf vxlan_public
      router-id 2.2.2.2
      aggregate-address 0.0.0.0/0 advertise-only
      neighbor 10.10.10.1 remote-as 65001
      neighbor 10.10.10.1 route-map ALLOW-ALL in
      neighbor 10.10.10.1 route-map ALLOW-ALL out
      neighbor 11.11.11.1 remote-as 65002
      neighbor 11.11.11.1 route-map ALLOW-ALL in
      neighbor 11.11.11.1 route-map ALLOW-ALL out
!
end
