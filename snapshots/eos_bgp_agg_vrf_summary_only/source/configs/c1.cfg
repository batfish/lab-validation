! Contributor originator. Redistributes two static routes (a /27 and a
! covered /32 host route) into BGP and advertises them to c2. Peers with
! c2's asdot AS 65166.10010 written in asdot notation.
!
hostname c1
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Ethernet1
   no switchport
   ip address 10.10.10.1/24
!
route-map ALLOW-ALL permit 10
!
ip route 10.1.1.96/27 Null0
ip route 10.1.1.98/32 Null0
!
ip routing
!
router bgp 65001
   router-id 1.1.1.1
   redistribute static
   neighbor 10.10.10.2 remote-as 65166.10010
   neighbor 10.10.10.2 route-map ALLOW-ALL in
   neighbor 10.10.10.2 route-map ALLOW-ALL out
!
end
