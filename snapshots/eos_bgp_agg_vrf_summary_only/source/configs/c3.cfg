! Downstream receiver. Peers with c2 across the vrf, referencing c2's AS
! in asplain notation (4270728986 = 65166.10010). Receives whatever c2
! advertises; with summary-only on c2 that is only the aggregate.
!
hostname c3
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Ethernet1
   no switchport
   ip address 11.11.11.1/24
!
route-map ALLOW-ALL permit 10
!
ip routing
!
router bgp 65002
   router-id 3.3.3.3
   neighbor 11.11.11.2 remote-as 4270728986
   neighbor 11.11.11.2 route-map ALLOW-ALL in
   neighbor 11.11.11.2 route-map ALLOW-ALL out
!
end
