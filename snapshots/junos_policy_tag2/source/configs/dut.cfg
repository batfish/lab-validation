system {
    host-name dut;
}
interfaces {
    ge-0/0/0 {
        description "to src (AS 65010)";
        unit 0 {
            family inet {
                address 10.0.1.1/31;
            }
        }
    }
    ge-0/0/1 {
        description "to rx (AS 300)";
        unit 0 {
            family inet {
                address 10.0.2.0/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.2/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.2;
    autonomous-system 200;
}
policy-options {
    policy-statement IMPORT-TAG2 {
        term tag2-100 {
            from {
                route-filter 10.110.1.0/24 exact;
            }
            then {
                tag2 100;
                accept;
            }
        }
        term tag2-200 {
            from {
                route-filter 10.110.2.0/24 exact;
            }
            then {
                tag2 200;
                accept;
            }
        }
        term untagged {
            then accept;
        }
    }
    /* No terminating action: the route goes on to MATCH-TAG2 with tag2 400. */
    policy-statement SET-TAG2 {
        term tag2-400 {
            from {
                route-filter 10.110.3.0/24 exact;
            }
            then tag2 400;
        }
    }
    policy-statement MATCH-TAG2 {
        term tag2-100 {
            from tag2 100;
            then accept;
        }
        term tag2-400 {
            from tag2 400;
            then accept;
        }
        term reject {
            then reject;
        }
    }
}
protocols {
    bgp {
        group SRC {
            type external;
            import IMPORT-TAG2;
            peer-as 65010;
            neighbor 10.0.1.0;
        }
        group RX {
            type external;
            export [ SET-TAG2 MATCH-TAG2 ];
            peer-as 300;
            neighbor 10.0.2.1;
        }
    }
}
