# Expected failures for the multiple-route-target EVPN lab.
#
# The multiple import/export route-target modeling gap (batfish#10113) and
# the related send-community extended gap (batfish#10116) are fixed, so the
# cross-VRF routes now reach the main RIB and test_main_rib_routes passes.
#
# The remaining BGP/EVPN RIB failures are the known locally-originated
# path-attribute divergence, not route-target related: the device carries
# locally-originated paths (the `network` loopbacks, and each leaf's own
# EVPN Type-5 route with an empty/local AS path and no next hop) that
# Batfish models with different attributes.
entries:
  - hostname: "leaf[12]"
    test_name: test_bgp_rib_routes
    skip:
      reason: "Locally-originated BGP path attribute divergence (network-statement loopbacks). https://github.com/batfish/lab-validation/issues/152"
  - hostname: "leaf[12]"
    test_name: test_evpn_rib_routes
    skip:
      reason: "Locally-originated EVPN Type-5 path attribute divergence (self-originated route, local AS path, no next hop). https://github.com/batfish/lab-validation/issues/152"
