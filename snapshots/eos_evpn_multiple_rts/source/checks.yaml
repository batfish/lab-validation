# Preconditions for the multiple-route-target EVPN lab. Verifies the
# EVPN overlay is up and that each leaf imports the peer's tenant
# loopback into its VRF via a non-last route-target. If these routes are
# present on the real device, any absence in Batfish is a modeling gap
# (batfish/batfish#10113), not a lab misconfiguration.

checks:
  # Underlay eBGP peers (what `show ip bgp summary` reports). The EVPN
  # overlay session over Loopback0 is proven up by the cross-VRF route
  # imports below.
  - type: bgp_peer_established
    node: leaf1
    neighbor: 172.31.255.1
    description: "leaf1 -> leaf2 IPv4 underlay"
  - type: bgp_peer_established
    node: leaf2
    neighbor: 172.31.255.0
    description: "leaf2 -> leaf1 IPv4 underlay"

  # Each leaf originates its own tenant loopback.
  - type: route_exists
    node: leaf1
    table: RED
    prefix: 10.1.1.1/32
    description: "RED originates 10.1.1.1/32 on leaf1"
  - type: route_exists
    node: leaf2
    table: BLUE
    prefix: 10.2.2.2/32
    description: "BLUE originates 10.2.2.2/32 on leaf2"

  # Cross-VRF imports via a non-last route-target. These are the routes
  # that disappear if only the last RT per direction is retained.
  - type: route_exists
    node: leaf2
    table: BLUE
    prefix: 10.1.1.1/32
    description: "BLUE imports leaf1 RED 10.1.1.1/32 via evpn 65000:200"
  - type: route_exists
    node: leaf1
    table: RED
    prefix: 10.2.2.2/32
    description: "RED imports leaf2 BLUE 10.2.2.2/32 via evpn 65000:100"
