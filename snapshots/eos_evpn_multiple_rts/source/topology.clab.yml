# Arista cEOS lab: a single EVPN VRF declaring MULTIPLE `route-target
# import evpn` and `route-target export evpn` lines. Reference:
# batfish/batfish#10113.
#
# Topology:
#
#   leaf1 (AS 65101)                          leaf2 (AS 65102)
#     vrf RED, L3VNI 15001                       vrf BLUE, L3VNI 15002
#     Loopback101 10.1.1.1/32 (RED)              Loopback101 10.2.2.2/32 (BLUE)
#     import  evpn 65000:100, 65000:199          import  evpn 65000:200, 65000:288
#     export  evpn 65000:200, 65000:299          export  evpn 65000:100, 65000:177
#       Et1 172.31.255.0/31 ------------------ Et1 172.31.255.1/31
#     Loopback0 192.168.255.1/32 (overlay)       Loopback0 192.168.255.2/32 (overlay)
#
# eBGP IPv4 underlay carries the loopbacks; eBGP EVPN overlay peers over
# Loopback0. Each VRF redistributes its tenant loopback as an EVPN Type-5
# route. The RTs are chosen so the *matching* value is never the last one
# listed in its direction: leaf2 BLUE imports leaf1 RED's 10.1.1.1/32 via
# 65000:200, and leaf1 RED imports leaf2 BLUE's 10.2.2.2/32 via 65000:100.
# A model that keeps only the last RT per direction matches nothing and
# imports neither route.

name: ceos-evpn-multiple-rts

topology:
  nodes:
    leaf1:
      kind: arista_ceos
      image: ceos:4.36.0.1F
      startup-config: configs/leaf1.cfg
    leaf2:
      kind: arista_ceos
      image: ceos:4.36.0.1F
      startup-config: configs/leaf2.cfg

  links:
    - endpoints: ["leaf1:eth1", "leaf2:eth1"]
