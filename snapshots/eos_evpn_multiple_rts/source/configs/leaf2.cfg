! leaf2 (AS 65102): EVPN VTEP with VRF BLUE using MULTIPLE import and
! export route-targets. As on leaf1, the matching RT is NOT listed last.
!
!   import evpn 65000:200  <- matches leaf1 RED export; must be kept
!   import evpn 65000:288  <- unused decoy (listed last)
!   export evpn 65000:100  <- matches leaf1 RED import; must be kept
!   export evpn 65000:177  <- unused decoy (listed last)
!
! On a correct model both leaf loopbacks (10.1.1.1 and 10.2.2.2) cross
! into the peer VRF. If only the last RT per direction survives, no
! RTs match and neither route is imported.
!
hostname leaf2
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
service routing protocols model multi-agent
!
vrf instance BLUE
!
interface Loopback0
   description EVPN_Overlay_Peering_and_VTEP_source
   ip address 192.168.255.2/32
!
interface Loopback101
   description BLUE_tenant_prefix
   vrf BLUE
   ip address 10.2.2.2/32
!
interface Ethernet1
   description P2P_UNDERLAY_TO_leaf1
   no switchport
   ip address 172.31.255.1/31
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vrf BLUE vni 15002
!
ip routing
ip routing vrf BLUE
!
ip prefix-list PL-LOOPBACKS
   seq 10 permit 192.168.255.0/24 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
router bgp 65102
   router-id 192.168.255.2
   no bgp default ipv4-unicast
   maximum-paths 2 ecmp 2
   neighbor 172.31.255.0 remote-as 65101
   neighbor 192.168.255.1 remote-as 65101
   neighbor 192.168.255.1 update-source Loopback0
   neighbor 192.168.255.1 ebgp-multihop 3
   neighbor 192.168.255.1 send-community extended
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor 192.168.255.1 activate
   !
   address-family ipv4
      neighbor 172.31.255.0 activate
      network 192.168.255.2/32
   !
   vrf BLUE
      rd 192.168.255.2:15002
      route-target import evpn 65000:200
      route-target import evpn 65000:288
      route-target export evpn 65000:100
      route-target export evpn 65000:177
      redistribute connected
!
end
