! Downstream receiver, AS 65004. Peers with the aggregator c2 and receives
! the 10.1.0.0/19 aggregate (plus the contributors, since summary-only is
! not configured). Used to observe the aggregate AS_PATH as advertised over
! eBGP (c2 prepends 65002).
!
hostname c3
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Ethernet1
   no switchport
   ip address 11.11.11.1/24
!
route-map ALLOW-ALL permit 10
!
ip routing
!
router bgp 65004
   router-id 3.3.3.3
   neighbor 11.11.11.2 remote-as 65002
   neighbor 11.11.11.2 route-map ALLOW-ALL in
   neighbor 11.11.11.2 route-map ALLOW-ALL out
!
end
