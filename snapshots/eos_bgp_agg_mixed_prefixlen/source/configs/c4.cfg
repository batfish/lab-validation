! Origin AS 65003. Originates the MANY SMALL contributors: a /24 plus eight
! /32 host routes, all more-specifics of c2's 10.1.0.0/19 aggregate. Its AS
! differs from c1's so contributors diverge after the common transit AS 65000.
!
hostname c4
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Ethernet1
   no switchport
   ip address 10.10.2.1/24
!
route-map ALLOW-ALL permit 10
!
ip route 10.1.16.0/24 Null0
ip route 10.1.17.1/32 Null0
ip route 10.1.17.2/32 Null0
ip route 10.1.17.3/32 Null0
ip route 10.1.17.4/32 Null0
ip route 10.1.17.5/32 Null0
ip route 10.1.17.6/32 Null0
ip route 10.1.17.7/32 Null0
ip route 10.1.17.8/32 Null0
!
ip routing
!
router bgp 65003
   router-id 4.4.4.4
   redistribute static
   neighbor 10.10.2.2 remote-as 65000
   neighbor 10.10.2.2 route-map ALLOW-ALL in
   neighbor 10.10.2.2 route-map ALLOW-ALL out
!
end
