! Origin AS 65001. Originates the single LARGE contributor 10.1.0.0/20 to
! c2's 10.1.0.0/19 aggregate.
!
hostname c1
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Ethernet1
   no switchport
   ip address 10.10.1.1/24
!
route-map ALLOW-ALL permit 10
!
ip route 10.1.0.0/20 Null0
!
ip routing
!
router bgp 65001
   router-id 1.1.1.1
   redistribute static
   neighbor 10.10.1.2 remote-as 65000
   neighbor 10.10.1.2 route-map ALLOW-ALL in
   neighbor 10.10.1.2 route-map ALLOW-ALL out
!
end
