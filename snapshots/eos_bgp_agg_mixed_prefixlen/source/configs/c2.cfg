! Aggregating router, AS 65002. Learns a mixed contributor set: one large
! /20 (via 65000 65001) and many small /24+/32 (via 65000 65003), and
! aggregates them into 10.1.0.0/19. No as-set, no summary-only, no
! advertise-only. Advertises the result to c3 (AS 65004). Isolates whether
! prefix length / contributor count affects the derived aggregate AS_PATH.
!
hostname c2
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
interface Ethernet1
   no switchport
   ip address 10.10.3.2/24
!
interface Ethernet2
   no switchport
   ip address 11.11.11.2/24
!
route-map ALLOW-ALL permit 10
!
ip routing
!
router bgp 65002
   router-id 2.2.2.2
   aggregate-address 10.1.0.0/19
   neighbor 10.10.3.1 remote-as 65000
   neighbor 10.10.3.1 route-map ALLOW-ALL in
   neighbor 10.10.3.1 route-map ALLOW-ALL out
   neighbor 11.11.11.1 remote-as 65004
   neighbor 11.11.11.1 route-map ALLOW-ALL in
   neighbor 11.11.11.1 route-map ALLOW-ALL out
!
end
