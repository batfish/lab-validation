system {
    host-name dut;
}
interfaces {
    ge-0/0/0 {
        description "to a (AS 65001)";
        unit 0 {
            family inet {
                address 10.0.1.1/31;
            }
        }
    }
    ge-0/0/1 {
        description "to b (AS 65002)";
        unit 0 {
            family inet {
                address 10.0.2.1/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.3/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.3;
    autonomous-system 200;
}
policy-options {
    policy-statement FROM-A {
        /* color alone: b has the lower color */
        term p2 {
            from {
                route-filter 10.150.2.0/24 exact;
            }
            then {
                color 200;
                accept;
            }
        }
        /* color against local-preference: a has the higher local-preference, b the lower color */
        term p3 {
            from {
                route-filter 10.150.3.0/24 exact;
            }
            then {
                local-preference 200;
                color 200;
                accept;
            }
        }
        /* color2 alone: equal color, b has the lower color2 */
        term p4 {
            from {
                route-filter 10.150.4.0/24 exact;
            }
            then {
                color 100;
                color2 200;
                accept;
            }
        }
        /* color before color2: a has the lower color, b the lower color2 */
        term p5 {
            from {
                route-filter 10.150.5.0/24 exact;
            }
            then {
                color 100;
                color2 100;
                accept;
            }
        }
        /* preference before color: a has the lower preference, b the lower color */
        term p6 {
            from {
                route-filter 10.150.6.0/24 exact;
            }
            then {
                preference 160;
                color 200;
                accept;
            }
        }
        term other {
            then accept;
        }
    }
    policy-statement FROM-B {
        /* color alone: b has the lower color */
        term p2 {
            from {
                route-filter 10.150.2.0/24 exact;
            }
            then {
                color 100;
                accept;
            }
        }
        /* color against local-preference: a has the higher local-preference, b the lower color */
        term p3 {
            from {
                route-filter 10.150.3.0/24 exact;
            }
            then {
                local-preference 100;
                color 100;
                accept;
            }
        }
        /* color2 alone: equal color, b has the lower color2 */
        term p4 {
            from {
                route-filter 10.150.4.0/24 exact;
            }
            then {
                color 100;
                color2 100;
                accept;
            }
        }
        /* color before color2: a has the lower color, b the lower color2 */
        term p5 {
            from {
                route-filter 10.150.5.0/24 exact;
            }
            then {
                color 200;
                color2 50;
                accept;
            }
        }
        /* preference before color: a has the lower preference, b the lower color */
        term p6 {
            from {
                route-filter 10.150.6.0/24 exact;
            }
            then {
                preference 170;
                color 100;
                accept;
            }
        }
        term other {
            then accept;
        }
    }
}
protocols {
    bgp {
        path-selection external-router-id;
        group A {
            type external;
            import FROM-A;
            peer-as 65001;
            neighbor 10.0.1.0;
        }
        group B {
            type external;
            import FROM-B;
            peer-as 65002;
            neighbor 10.0.2.0;
        }
    }
}
