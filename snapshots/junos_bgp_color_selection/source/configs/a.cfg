system {
    host-name a;
}
interfaces {
    ge-0/0/0 {
        description "to dut (AS 200)";
        unit 0 {
            family inet {
                address 10.0.1.0/31;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.1/32;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.1;
    autonomous-system 65001;
    static {
        route 10.150.1.0/24 discard;
        route 10.150.2.0/24 discard;
        route 10.150.3.0/24 discard;
        route 10.150.4.0/24 discard;
        route 10.150.5.0/24 discard;
        route 10.150.6.0/24 discard;
    }
}
policy-options {
    policy-statement STATICS {
        term statics {
            from protocol static;
            then accept;
        }
        term reject {
            then reject;
        }
    }
}
protocols {
    bgp {
        group DUT {
            type external;
            export STATICS;
            peer-as 200;
            neighbor 10.0.1.1;
        }
    }
}
