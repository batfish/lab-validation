system {
    host-name sender;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet6 {
                address 2001:db8:12::1/64;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet6 {
                address 2001:db8:13::1/64;
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet6 {
                address 2001:db8:14::1/64;
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            family inet6 {
                address 2001:db8:15::1/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 1.1.1.1/32;
            }
        }
    }
}
routing-options {
    autonomous-system 65001;
    router-id 1.1.1.1;
    rib inet6.0 {
        static {
            route 2001:db8:100::/48 discard;
            route 2001:db8:200::/48 discard;
            route 2001:db8:300::/48 discard;
        }
    }
}
policy-options {
    policy-statement ADV-100 {
        term p {
            from {
                route-filter 2001:db8:100::/48 exact;
            }
            then accept;
        }
        term default {
            then reject;
        }
    }
    policy-statement ADV-400 {
        term p {
            from {
                route-filter 2001:db8:400::/48 exact;
            }
            then accept;
        }
        term default {
            then reject;
        }
    }
    policy-statement ADV-300 {
        term p {
            from {
                route-filter 2001:db8:300::/48 exact;
            }
            then accept;
        }
        term default {
            then reject;
        }
    }
    policy-statement ADV-200 {
        term p {
            from {
                route-filter 2001:db8:200::/48 exact;
            }
            then accept;
        }
        term default {
            then reject;
        }
    }
}
routing-instances {
    /* protocol-level disable-linklocal-addr, isolated from the master sessions */
    PROTO {
        instance-type virtual-router;
        interface ge-0/0/3.0;
        routing-options {
            router-id 1.1.1.2;
            rib PROTO.inet6.0 {
                static {
                    route 2001:db8:400::/48 discard;
                }
            }
        }
        protocols {
            bgp {
                disable-linklocal-addr;
                group LINK15 {
                    type external;
                    family inet6 {
                        unicast;
                    }
                    export ADV-400;
                    peer-as 65002;
                    neighbor 2001:db8:15::2;
                }
            }
        }
    }
}
protocols {
    bgp {
        /* no disable-linklocal-addr: baseline */
        group LINK12 {
            type external;
            family inet6 {
                unicast;
            }
            export ADV-100;
            peer-as 65002;
            neighbor 2001:db8:12::2;
        }
        /* group-level disable-linklocal-addr */
        group LINK13 {
            type external;
            disable-linklocal-addr;
            family inet6 {
                unicast;
            }
            export ADV-200;
            peer-as 65002;
            neighbor 2001:db8:13::2;
        }
        /* neighbor-level disable-linklocal-addr */
        group LINK14 {
            type external;
            family inet6 {
                unicast;
            }
            export ADV-300;
            peer-as 65002;
            neighbor 2001:db8:14::2 {
                disable-linklocal-addr;
            }
        }
    }
}
