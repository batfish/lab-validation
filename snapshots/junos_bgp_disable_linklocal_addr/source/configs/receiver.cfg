system {
    host-name receiver;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet6 {
                address 2001:db8:12::2/64;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet6 {
                address 2001:db8:13::2/64;
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet6 {
                address 2001:db8:14::2/64;
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            family inet6 {
                address 2001:db8:15::2/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 2.2.2.2/32;
            }
        }
    }
}
routing-options {
    autonomous-system 65002;
    router-id 2.2.2.2;
}
protocols {
    bgp {
        /* received MP_REACH next hops, read by checks.yaml */
        traceoptions {
            file bgp-updates size 10m files 2;
            flag update detail;
        }
        group LINK12 {
            type external;
            family inet6 {
                unicast;
            }
            peer-as 65001;
            neighbor 2001:db8:12::1;
        }
        group LINK13 {
            type external;
            family inet6 {
                unicast;
            }
            peer-as 65001;
            neighbor 2001:db8:13::1;
        }
        group LINK14 {
            type external;
            family inet6 {
                unicast;
            }
            peer-as 65001;
            neighbor 2001:db8:14::1;
        }
        group LINK15 {
            type external;
            family inet6 {
                unicast;
            }
            peer-as 65001;
            neighbor 2001:db8:15::1;
        }
    }
}
