hostname peer
!
username admin privilege 15 secret admin
!
aaa authorization exec default local
!
vrf instance VR
!
interface Loopback0
   ip address 10.255.0.2/32
   ipv6 address 2001:db8:ff::2/128
   ipv6 ospf 1 area 0.0.0.0
!
interface Loopback1
   vrf VR
   ip address 10.255.1.2/32
   ipv6 address 2001:db8:ff:1::2/128
   ipv6 ospf 2 area 0.0.0.0
!
interface Ethernet1
   no switchport
   ip address 10.0.1.1/31
   ipv6 address 2001:db8:1::2/64
   ip ospf network point-to-point
   ipv6 ospf network point-to-point
   ipv6 ospf 1 area 0.0.0.0
!
interface Ethernet2
   no switchport
   ip address 10.0.2.1/31
   ipv6 address 2001:db8:2::2/64
   ip ospf network point-to-point
   ipv6 ospf network point-to-point
   ipv6 ospf 1 area 0.0.0.0
!
interface Ethernet3
   no switchport
   vrf VR
   ip address 10.0.3.1/31
   ipv6 address 2001:db8:3::2/64
   ip ospf network point-to-point
   ipv6 ospf network point-to-point
   ipv6 ospf 2 area 0.0.0.0
!
ip routing
ip routing vrf VR
ipv6 unicast-routing
ipv6 unicast-routing vrf VR
!
router ospf 1
   router-id 10.255.0.2
   network 10.0.1.0/31 area 0.0.0.0
   network 10.0.2.0/31 area 0.0.0.0
   network 10.255.0.2/32 area 0.0.0.0
!
router ospf 2 vrf VR
   router-id 10.255.1.2
   network 10.0.3.0/31 area 0.0.0.0
   network 10.255.1.2/32 area 0.0.0.0
!
ipv6 router ospf 1
   router-id 10.255.0.2
!
ipv6 router ospf 2 vrf VR
   router-id 10.255.1.2
!
end
