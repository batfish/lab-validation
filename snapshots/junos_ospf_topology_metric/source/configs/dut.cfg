system {
    host-name dut;
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.1.0/31;
            }
            family inet6 {
                address 2001:db8:1::1/64;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.0.2.0/31;
            }
            family inet6 {
                address 2001:db8:2::1/64;
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet {
                address 10.0.3.0/31;
            }
            family inet6 {
                address 2001:db8:3::1/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.0.1/32;
            }
            family inet6 {
                address 2001:db8:ff::1/128;
            }
        }
        unit 1 {
            family inet {
                address 10.255.1.1/32;
            }
            family inet6 {
                address 2001:db8:ff:1::1/128;
            }
        }
    }
}
routing-options {
    router-id 10.255.0.1;
}
routing-instances {
    VR {
        instance-type virtual-router;
        interface ge-0/0/2.0;
        interface lo0.1;
        routing-options {
            router-id 10.255.1.1;
        }
        protocols {
            ospf {
                /* what `load set` keeps of `topology default metric 65450` */
                topology default;
                area 0.0.0.0 {
                    interface ge-0/0/2.0 {
                        interface-type p2p;
                        topology default metric 100;
                    }
                    interface lo0.1 {
                        passive;
                    }
                }
            }
            ospf3 {
                area 0.0.0.0 {
                    interface ge-0/0/2.0 {
                        interface-type p2p;
                        metric 100;
                    }
                    interface lo0.1 {
                        passive;
                    }
                }
            }
        }
    }
}
protocols {
    ospf {
        /* what `load set` keeps of `topology default metric 65450` */
        topology default;
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                interface-type p2p;
                topology default metric 100;
            }
            interface ge-0/0/1.0 {
                interface-type p2p;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
    ospf3 {
        area 0.0.0.0 {
            interface ge-0/0/0.0 {
                interface-type p2p;
                metric 100;
            }
            interface ge-0/0/1.0 {
                interface-type p2p;
            }
            interface lo0.0 {
                passive;
            }
        }
    }
}
