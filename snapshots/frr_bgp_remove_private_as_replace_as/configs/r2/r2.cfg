r2
# This file describes the network interfaces
auto lo
iface lo inet loopback

auto eth1
iface eth1

auto eth2
iface eth2

auto eth3
iface eth3

auto eth4
iface eth4

auto eth5
iface eth5

auto eth6
iface eth6

auto eth7
iface eth7

auto eth8
iface eth8

# ports.conf --
frr version 10.7.1_git
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
ip prefix-list ALL-REPLACE seq 5 permit 192.0.2.0/26
ip prefix-list ALL-REPLACE seq 10 permit 203.0.113.0/26
ip prefix-list REPLACE seq 5 permit 192.0.2.64/26
ip prefix-list REPLACE seq 10 permit 203.0.113.64/26
ip prefix-list BASIC seq 5 permit 192.0.2.128/26
ip prefix-list BASIC seq 10 permit 203.0.113.128/26
ip prefix-list ALL seq 5 permit 192.0.2.192/26
ip prefix-list ALL seq 10 permit 203.0.113.192/26
ip prefix-list LOCAL-AS seq 5 permit 198.51.100.0/26
ip prefix-list PEER-AS-BASIC seq 5 permit 198.51.100.64/26
ip prefix-list PEER-AS-ALL seq 5 permit 198.51.100.128/26
ip prefix-list PEER-AS-ALL seq 10 permit 198.51.100.192/26
!
route-map ALLOW permit 10
exit
!
route-map TO-R3-ALL-REPLACE permit 10
 match ip address prefix-list ALL-REPLACE
exit
!
route-map TO-R3-REPLACE permit 10
 match ip address prefix-list REPLACE
exit
!
route-map TO-R3-BASIC permit 10
 match ip address prefix-list BASIC
exit
!
route-map TO-R3-ALL permit 10
 match ip address prefix-list ALL
exit
!
route-map TO-R3-LOCAL-AS permit 10
 match ip address prefix-list LOCAL-AS
exit
!
route-map TO-R4-BASIC permit 10
 match ip address prefix-list PEER-AS-BASIC
exit
!
route-map TO-R4-ALL permit 10
 match ip address prefix-list PEER-AS-ALL
exit
!
interface eth1
 ip address 10.0.12.1/31
exit
!
interface eth2
 ip address 10.0.23.0/31
exit
!
interface eth3
 ip address 10.0.23.2/31
exit
!
interface eth4
 ip address 10.0.23.4/31
exit
!
interface eth5
 ip address 10.0.23.6/31
exit
!
interface eth6
 ip address 10.0.23.8/31
exit
!
interface eth7
 ip address 10.0.24.0/31
exit
!
interface eth8
 ip address 10.0.24.2/31
exit
!
router bgp 64500
 bgp router-id 10.255.0.2
 neighbor 10.0.12.0 remote-as 64601
 neighbor 10.0.23.1 remote-as 64496
 neighbor 10.0.23.3 remote-as 64496
 neighbor 10.0.23.5 remote-as 64496
 neighbor 10.0.23.7 remote-as 64496
 neighbor 10.0.23.9 remote-as 64496
 neighbor 10.0.23.9 local-as 64511 no-prepend replace-as
 neighbor 10.0.24.1 remote-as 64602
 neighbor 10.0.24.3 remote-as 64602
 !
 address-family ipv4 unicast
  neighbor 10.0.12.0 route-map ALLOW in
  neighbor 10.0.12.0 route-map ALLOW out
  neighbor 10.0.23.1 remove-private-AS all replace-AS
  neighbor 10.0.23.1 route-map ALLOW in
  neighbor 10.0.23.1 route-map TO-R3-ALL-REPLACE out
  neighbor 10.0.23.3 remove-private-AS replace-AS
  neighbor 10.0.23.3 route-map ALLOW in
  neighbor 10.0.23.3 route-map TO-R3-REPLACE out
  neighbor 10.0.23.5 remove-private-AS
  neighbor 10.0.23.5 route-map ALLOW in
  neighbor 10.0.23.5 route-map TO-R3-BASIC out
  neighbor 10.0.23.7 remove-private-AS all
  neighbor 10.0.23.7 route-map ALLOW in
  neighbor 10.0.23.7 route-map TO-R3-ALL out
  neighbor 10.0.23.9 remove-private-AS all replace-AS
  neighbor 10.0.23.9 route-map ALLOW in
  neighbor 10.0.23.9 route-map TO-R3-LOCAL-AS out
  neighbor 10.0.24.1 remove-private-AS
  neighbor 10.0.24.1 route-map ALLOW in
  neighbor 10.0.24.1 route-map TO-R4-BASIC out
  neighbor 10.0.24.3 remove-private-AS all
  neighbor 10.0.24.3 route-map ALLOW in
  neighbor 10.0.24.3 route-map TO-R4-ALL out
 exit-address-family
exit
!
end
