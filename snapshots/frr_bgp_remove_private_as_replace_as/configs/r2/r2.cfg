r2
# This file describes the network interfaces
auto lo
iface lo inet loopback

auto eth1
iface eth1

auto eth2
iface eth2

auto eth3
iface eth3

# ports.conf --
frr version 10.7.1_git
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
ip prefix-list P1 seq 5 permit 192.0.2.0/24
ip prefix-list P2 seq 5 permit 198.51.100.0/24
!
route-map ALLOW permit 10
exit
!
route-map TO-R3-ALL-REPLACE permit 10
 match ip address prefix-list P1
 set origin incomplete
exit
!
route-map TO-R3-REPLACE permit 10
 match ip address prefix-list P2
 set origin incomplete
exit
!
interface eth1
 ip address 10.0.12.1/31
exit
!
interface eth2
 ip address 10.0.23.0/31
exit
!
interface eth3
 ip address 10.0.23.2/31
exit
!
router bgp 64500
 bgp router-id 10.255.0.2
 neighbor 10.0.12.0 remote-as 64601
 neighbor 10.0.23.1 remote-as 64496
 neighbor 10.0.23.3 remote-as 64496
 !
 address-family ipv4 unicast
  neighbor 10.0.12.0 route-map ALLOW in
  neighbor 10.0.12.0 route-map ALLOW out
  neighbor 10.0.23.1 remove-private-AS all replace-AS
  neighbor 10.0.23.1 route-map ALLOW in
  neighbor 10.0.23.1 route-map TO-R3-ALL-REPLACE out
  neighbor 10.0.23.3 remove-private-AS replace-AS
  neighbor 10.0.23.3 route-map ALLOW in
  neighbor 10.0.23.3 route-map TO-R3-REPLACE out
 exit-address-family
exit
!
end
