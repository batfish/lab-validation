r4
# This file describes the network interfaces
auto lo
iface lo inet loopback

auto eth1
iface eth1

auto eth2
iface eth2

# ports.conf --
frr version 10.7.1_git
frr defaults traditional
hostname r4
service integrated-vtysh-config
!
route-map ALLOW permit 10
exit
!
interface eth1
 ip address 10.0.24.1/31
exit
!
interface eth2
 ip address 10.0.24.3/31
exit
!
router bgp 64602
 bgp router-id 10.255.0.4
 neighbor 10.0.24.0 remote-as 64500
 neighbor 10.0.24.2 remote-as 64500
 !
 address-family ipv4 unicast
  neighbor 10.0.24.0 route-map ALLOW in
  neighbor 10.0.24.0 route-map ALLOW out
  neighbor 10.0.24.2 route-map ALLOW in
  neighbor 10.0.24.2 route-map ALLOW out
 exit-address-family
exit
!
end
