r1
# This file describes the network interfaces
auto lo
iface lo inet loopback

auto eth1
iface eth1

# ports.conf --
frr version 10.7.1_git
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
ip prefix-list MIXED seq 5 permit 203.0.113.0/24 ge 26 le 26
ip prefix-list PEER-AS seq 5 permit 198.51.100.64/26
ip prefix-list PEER-AS seq 10 permit 198.51.100.128/26
!
route-map ALLOW permit 10
exit
!
route-map TO-R2 permit 10
 match ip address prefix-list MIXED
 set as-path prepend 64497
exit
!
route-map TO-R2 permit 20
 match ip address prefix-list PEER-AS
 set as-path prepend 64602
exit
!
route-map TO-R2 permit 30
exit
!
ip route 192.0.2.0/26 blackhole
ip route 192.0.2.64/26 blackhole
ip route 192.0.2.128/26 blackhole
ip route 192.0.2.192/26 blackhole
ip route 198.51.100.0/26 blackhole
ip route 198.51.100.64/26 blackhole
ip route 198.51.100.128/26 blackhole
ip route 198.51.100.192/26 blackhole
ip route 203.0.113.0/26 blackhole
ip route 203.0.113.64/26 blackhole
ip route 203.0.113.128/26 blackhole
ip route 203.0.113.192/26 blackhole
!
interface eth1
 ip address 10.0.12.0/31
exit
!
router bgp 64601
 bgp router-id 10.255.0.1
 neighbor 10.0.12.1 remote-as 64500
 !
 address-family ipv4 unicast
  network 192.0.2.0/26
  network 192.0.2.64/26
  network 192.0.2.128/26
  network 192.0.2.192/26
  network 198.51.100.0/26
  network 198.51.100.64/26
  network 198.51.100.128/26
  network 198.51.100.192/26
  network 203.0.113.0/26
  network 203.0.113.64/26
  network 203.0.113.128/26
  network 203.0.113.192/26
  neighbor 10.0.12.1 route-map ALLOW in
  neighbor 10.0.12.1 route-map TO-R2 out
 exit-address-family
exit
!
end
