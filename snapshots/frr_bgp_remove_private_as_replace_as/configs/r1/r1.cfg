r1
# This file describes the network interfaces
auto lo
iface lo inet loopback

auto eth1
iface eth1

auto eth2
iface eth2

# ports.conf --
frr version 10.7.1_git
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
route-map ALLOW permit 10
exit
!
ip route 192.0.2.0/24 blackhole
ip route 198.51.100.0/24 blackhole
!
interface eth1
 ip address 10.0.12.0/31
exit
!
interface eth2
 ip address 10.0.14.0/31
exit
!
router bgp 64601
 bgp router-id 10.255.0.1
 neighbor 10.0.12.1 remote-as 64500
 neighbor 10.0.14.1 remote-as 64499
 !
 address-family ipv4 unicast
  network 192.0.2.0/24
  network 198.51.100.0/24
  neighbor 10.0.12.1 route-map ALLOW in
  neighbor 10.0.12.1 route-map ALLOW out
  neighbor 10.0.14.1 route-map ALLOW in
  neighbor 10.0.14.1 route-map ALLOW out
 exit-address-family
exit
!
end
