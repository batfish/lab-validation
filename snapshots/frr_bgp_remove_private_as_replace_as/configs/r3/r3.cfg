r3
# This file describes the network interfaces
auto lo
iface lo inet loopback

auto eth1
iface eth1

auto eth2
iface eth2

auto eth3
iface eth3

auto eth4
iface eth4

auto eth5
iface eth5

# ports.conf --
frr version 10.7.1_git
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
route-map ALLOW permit 10
exit
!
interface eth1
 ip address 10.0.23.1/31
exit
!
interface eth2
 ip address 10.0.23.3/31
exit
!
interface eth3
 ip address 10.0.23.5/31
exit
!
interface eth4
 ip address 10.0.23.7/31
exit
!
interface eth5
 ip address 10.0.23.9/31
exit
!
router bgp 64496
 bgp router-id 10.255.0.3
 neighbor 10.0.23.0 remote-as 64500
 neighbor 10.0.23.2 remote-as 64500
 neighbor 10.0.23.4 remote-as 64500
 neighbor 10.0.23.6 remote-as 64500
 neighbor 10.0.23.8 remote-as 64511
 !
 address-family ipv4 unicast
  neighbor 10.0.23.0 route-map ALLOW in
  neighbor 10.0.23.0 route-map ALLOW out
  neighbor 10.0.23.2 route-map ALLOW in
  neighbor 10.0.23.2 route-map ALLOW out
  neighbor 10.0.23.4 route-map ALLOW in
  neighbor 10.0.23.4 route-map ALLOW out
  neighbor 10.0.23.6 route-map ALLOW in
  neighbor 10.0.23.6 route-map ALLOW out
  neighbor 10.0.23.8 route-map ALLOW in
  neighbor 10.0.23.8 route-map ALLOW out
 exit-address-family
exit
!
end
