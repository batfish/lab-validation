# Four FRR routers in eBGP. r1 (private AS 64601) originates twelve
# prefixes and sends them to r2 (AS 64500). r2 sends each to r3 (AS 64496)
# or r4 (private AS 64602) over a session with one remove-private-AS mode.
#
#   r1 eth1 -- r2 eth1          10.0.12.0/31
#   r2 eth2..eth6 -- r3 eth1..eth5  10.0.23.0/31 .. 10.0.23.8/31
#   r2 eth7..eth8 -- r4 eth1..eth2  10.0.24.0/31, 10.0.24.2/31
#
# r2 to r3: eth2 "all replace-AS", eth3 "replace-AS", eth4 bare
# "remove-private-AS", eth5 "all", eth6 "all replace-AS" with "local-as
# 64511 no-prepend replace-as". r2 to r4: eth7 bare, eth8 "all". The
# README lists the prefixes.
#
# Links use the Linux default MTU of 1500 rather than containerlab's 9500.

name: frr-bgp-remove-private-as-replace-as

topology:
  kinds:
    frr:
      image: quay.io/frrouting/frr:containerlab-10.7.1
      daemons:
        - bgpd

  nodes:
    r1:
      kind: frr
      startup-config: configs/r1.conf
    r2:
      kind: frr
      startup-config: configs/r2.conf
    r3:
      kind: frr
      startup-config: configs/r3.conf
    r4:
      kind: frr
      startup-config: configs/r4.conf

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
      mtu: 1500
    - endpoints: ["r2:eth2", "r3:eth1"]
      mtu: 1500
    - endpoints: ["r2:eth3", "r3:eth2"]
      mtu: 1500
    - endpoints: ["r2:eth4", "r3:eth3"]
      mtu: 1500
    - endpoints: ["r2:eth5", "r3:eth4"]
      mtu: 1500
    - endpoints: ["r2:eth6", "r3:eth5"]
      mtu: 1500
    - endpoints: ["r2:eth7", "r4:eth1"]
      mtu: 1500
    - endpoints: ["r2:eth8", "r4:eth2"]
      mtu: 1500
