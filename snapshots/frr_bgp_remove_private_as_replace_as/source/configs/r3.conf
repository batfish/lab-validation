frr version 10.7.1
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.23.1/31
!
interface eth2
 ip address 10.0.23.3/31
!
interface eth3
 ip address 10.0.34.1/31
!
router bgp 64496
 bgp router-id 10.255.0.3
 neighbor 10.0.23.0 remote-as 64500
 neighbor 10.0.23.2 remote-as 64500
 neighbor 10.0.34.0 remote-as 64499
 !
 address-family ipv4 unicast
  neighbor 10.0.23.0 route-map ALLOW in
  neighbor 10.0.23.0 route-map ALLOW out
  neighbor 10.0.23.2 route-map ALLOW in
  neighbor 10.0.23.2 route-map ALLOW out
  neighbor 10.0.34.0 route-map ALLOW in
  neighbor 10.0.34.0 route-map ALLOW out
 exit-address-family
!
route-map ALLOW permit 10
!
end
